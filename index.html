<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hand Tracking</title>
  <link rel="icon" href="data:,">

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    #container {
      position: relative;
      display: inline-block;
    }

    video, canvas {
      width: 640px;
      max-width: 95vw;
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
    }

    #status {
      font-size: 20px;
      margin: 15px;
    }
  </style>
</head>

<body>

<h1>✋ Hand Tracking</h1>
<div id="status">Starting...</div>

<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<script type="module">

import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

async function main() {

  // CAMERA
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      width: 640,
      height: 480
    }
  });

  video.srcObject = stream;

  await video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  status.textContent = "Loading hand tracker...";

  // MEDIAPIPE
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
  );

  const handLandmarker = await HandLandmarker.createFromOptions(
    vision,
    {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      },
      runningMode: "VIDEO",
      numHands: 2,
      minHandDetectionConfidence: 0.3,
      minHandPresenceConfidence: 0.3,
      minTrackingConfidence: 0.3
    }
  );

  status.textContent = "Show your hand ✋";

  let lastTime = -1;

  function detect() {

    if (video.readyState >= 2) {

      const now = performance.now();

      if (now !== lastTime) {

        lastTime = now;

        const result = handLandmarker.detectForVideo(
          video,
          now
        );

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        if (result.landmarks && result.landmarks.length > 0) {

          status.textContent =
            "✅ HAND DETECTED!";

          for (const hand of result.landmarks) {

            // LINES
            ctx.strokeStyle = "lime";
            ctx.lineWidth = 4;

            const connections = [
              [0,1],[1,2],[2,3],[3,4],
              [0,5],[5,6],[6,7],[7,8],
              [5,9],[9,10],[10,11],[11,12],
              [9,13],[13,14],[14,15],[15,16],
              [13,17],[17,18],[18,19],[19,20],
              [0,17]
            ];

            for (const [a,b] of connections) {

              ctx.beginPath();

              ctx.moveTo(
                hand[a].x * canvas.width,
                hand[a].y * canvas.height
              );

              ctx.lineTo(
                hand[b].x * canvas.width,
                hand[b].y * canvas.height
              );

              ctx.stroke();
            }

            // DOTS
            ctx.fillStyle = "lime";

            for (const point of hand) {

              const x = point.x * canvas.width;
              const y = point.y * canvas.height;

              ctx.beginPath();
              ctx.arc(x, y, 7, 0, Math.PI * 2);
              ctx.fill();
            }
          }

        } else {
          status.textContent = "👋 No hand detected";
        }
      }
    }

    requestAnimationFrame(detect);
  }

  detect();
}

main().catch(error => {

  console.error(error);

  status.textContent =
    "❌ Error: " + error.message;

});

</script>

</body>
</html>
